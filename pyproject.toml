[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "smart-mirror-pi"
version = "1.0.0"
description = "Retail fashion kiosk — outfit comparison mirror running on Raspberry Pi"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6.0",
    "qrcode[pil]>=7.4",
]

[project.scripts]
smart-mirror = "app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ── Ruff (linter + formatter) ─────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
]
ignore = [
    "BLE001",  # blind Exception catch — intentional in shutdown/crash guards
    "N802",    # function name should be lowercase — Qt overrides (do_GET etc.)
    "N803",    # argument name should be lowercase — Qt signal args
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]   # allow assert in tests

# ── Mypy (type checking) ──────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true   # PySide6 stubs not always available
warn_unused_ignores = true
warn_return_any = false         # Qt slots return Any by design

# Treat Qt as untyped *consistently* — whether or not PySide6 is installed in
# the checking environment. PySide6's bundled hints are stricter than the
# dynamic Qt idioms this app relies on (string-typed Property() for QML list
# exposure, setCamera(None) to detach a capture session, and Property
# descriptors that return their value type at runtime), producing false
# positives that aren't real bugs. ignore_missing_imports already does this when
# PySide6 is absent; follow_imports=skip extends the same Qt-as-Any treatment to
# environments where it IS installed, so mypy stays green either way. No runtime
# effect — this only affects type checking.
[[tool.mypy.overrides]]
module = "PySide6.*"
follow_imports = "skip"
follow_imports_for_stubs = true

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
